name: Android APK

on:
  push:
    branches: [android-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install and build web app
        run: |
          npm ci --include=dev || npm install --include=dev
          npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Luna-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Luna-test-apk
          path: Luna-test.apk

      - name: Publish to a pre-release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Luna test APK (latest)
          prerelease: true
          files: Luna-test.apk
          body: Latest test build from the android-app branch. Download Luna-test.apk and install it.
